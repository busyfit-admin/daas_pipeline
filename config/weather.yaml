# Weather pipeline configuration (merged on top of config/base.yaml).
# Paths are relative to the project root. Run with: make pipeline DATASET=weather

dataset: weather

# --- Source API -------------------------------------------------------------
api:
  url: https://api.open-meteo.com/v1/forecast
  past_days: 31
  cache:
    file: data/_cache/openmeteo
    expire_after_seconds: 3600
  retry:
    retries: 5
    backoff_factor: 0.2
  extra_params: {}          # any additional Open-Meteo query params, e.g. {timezone: Australia/Melbourne}

# --- Region: requested as a grid of points ------------------------------------
region:
  name: melbourne
  south: -38.06
  west: 144.71
  north: -37.56
  east: 145.21
  grid_step_degrees: 0.25

# --- Daily variables ----------------------------------------------------------
# Requested from the API and read back in this order.
# type: timestamp (epoch seconds -> UTC timestamp) | float
daily_variables:
  sunrise: timestamp
  sunset: timestamp
  rain_sum: float
  temperature_2m_max: float
  temperature_2m_min: float

# --- 10_raw layer ---------------------------------------------------------------
raw:
  script: pipeline_layers/10_ingest/weather_api.py
  dir: data/10_raw/weather
  file_prefix: weather        # files land as <file_prefix>_<lat>_<lon>.csv

# --- 20_staging layer: full SCD Type 2 history ------------------------------------
staging:
  dir: 20_staging
  namespace: staging
  table: weather_daily
  watermark_property: staging.last_batch_id
  key_columns: [latitude, longitude, date]   # one row per location per day
  # Data columns in table order, with types: string | float | int | bool | date | timestamp
  columns:
    latitude: float
    longitude: float
    date: date
    elevation: float
    sunrise: timestamp
    sunset: timestamp
    rain_sum: float
    temperature_2m_max: float
    temperature_2m_min: float
  float_decimals: 4          # stabilise coordinates and strip float32 noise so hashes are stable
  # Rows where all of these are null carry no measurements and are dropped
  drop_if_all_null: [sunrise, sunset, rain_sum, temperature_2m_max, temperature_2m_min]
  checks:
    non_negative: [rain_sum]                                  # negative values are nulled
    less_or_equal: [[temperature_2m_min, temperature_2m_max]] # violations are reported

# --- 30_current layer: latest version of every staging record -------------------
current:
  dir: 30_current
  namespace: current
  table: weather_daily
